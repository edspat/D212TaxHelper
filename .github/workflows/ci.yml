name: CI

# Runs on every push to develop / main, and on every PR targeting those
# branches. Keeps the long-running develop branch always-green so the eventual
# develop → main release PR is a low-risk event.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: tests · node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Syntax check — server.js
        run: node --check server.js

      - name: Syntax check — public/js/app.js
        run: node --check public/js/app.js

      - name: i18n completeness
        run: npm run check-i18n

      - name: Unit + e2e tests
        run: npm test

  pr-cleanliness:
    name: pr-cleanliness
    runs-on: ubuntu-latest
    # Only meaningful for PRs (compares against the target branch).
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PR contains no .gitignored files
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Base: $BASE_SHA"
          echo "Head: $HEAD_SHA"

          # Files added or modified by this PR (deletions are fine).
          mapfile -t CHANGED < <(git diff --name-only --diff-filter=AM "$BASE_SHA...$HEAD_SHA")

          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No added/modified files. PR is clean."
            exit 0
          fi

          echo "Changed files (${#CHANGED[@]}):"
          printf '  %s\n' "${CHANGED[@]}"

          # `git check-ignore --no-index` reports any path that matches a
          # .gitignore rule, even if the file is tracked (catches `git add -f`
          # of personal data, portable build output, db files, etc.).
          # Negation patterns like `!data/pdf_metadata.json` are honored.
          # Exit 0 = at least one match; 1 = none; >1 = real error.
          OFFENDERS=""
          set +e
          OFFENDERS=$(git check-ignore --verbose --no-index -- "${CHANGED[@]}")
          RC=$?
          set -e
          if [ "$RC" -gt 1 ]; then
            echo "::error::git check-ignore failed (exit $RC)"
            exit "$RC"
          fi

          if [ -n "$OFFENDERS" ]; then
            echo ""
            echo "::error::PR contains files that match .gitignore rules."
            echo "These look like personal data, build artifacts, or local-only"
            echo "files that should not be committed. Either remove them or, if"
            echo "they truly belong, update .gitignore (e.g. with a negation"
            echo "rule like \`!data/pdf_metadata.json\`)."
            echo ""
            echo "$OFFENDERS"
            exit 1
          fi

          echo "PR is clean — no .gitignored files committed."
